[package]
name = "erk-invalidation"
description = "Erk Engine invalidation: what changed since the last frame, and what it makes dirty."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The one project dependency this crate may have (p2-incremental §3.12;
# checked in CI): it knows the document, nothing above it.
erk-dom = { path = "../erk-dom" }

[features]
# Keep why each node became dirty, in a ring buffer: for development and
# the developer tools (M7). Off in release builds, where it costs nothing.
inspect = []

[lints]
workspace = true
