[package]
name = "erk"
description = "Erk Engine: an embedded HTML/CSS UI engine. The Rust API."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The engine and the raster; the document and the style system stay behind
# them (p1-contract §1.1). The raster draws into the window on the GPU.
erk-renderer = { path = "../erk-renderer", features = ["gpu"] }
softbuffer = "=0.4.8"
winit = "=0.30.13"
# The system's fonts, scanned here and not in the core (p1-contract §6.2):
# DirectWrite, fontconfig or CoreText. fontconfig is loaded at run time, so
# Linux builds need no C library; without it only the embedded font remains.
# Same version Parley uses in the renderer.
fontique = { version = "=0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
# The system's clipboard for a window (M5 plan, decision 5: the clipboard is
# I/O and stays out of the core). Text only: no image support, and on Linux
# X11 only (Wayland sessions reach it through XWayland).
arboard = { version = "=3.7.0", default-features = false }
# The platform's accessibility tree for a window (M5.11): the renderer
# gives Erk's own plain tree, AccessKit hands it to UI Automation, AT-SPI or
# NSAccessibility, built only once a screen reader asks for it.
accesskit = "=0.25.2"
accesskit_winit = "=0.34.2"

[dev-dependencies]
png = "0.18"
# The memory measurement only (M5.13, examples/memory.rs): a heap profiler
# as the global allocator, which counts what is live and where it was
# allocated. Never in the engine: a dev-dependency reaches no host.
dhat = "=0.3.3"
serde_json = "1"

[lints]
workspace = true
