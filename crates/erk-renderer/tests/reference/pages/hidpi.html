<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="erk-device-scale" content="2">
<title>Yüksek çözünürlük</title>
<style>
  body { margin: 24px; background: #e2e8f0; color: #1f2933; font-family: "Noto Sans"; font-size: 16px; }
  .kart { width: 360px; padding: 16px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 2px 3px rgba(15, 23, 42, 0.35); }
  .baslik { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .baslik img { display: block; }
  h2 { margin: 0; font-size: 20px; }
  p { margin: 0 0 8px 0; line-height: 1.5; }
  .ince { border-top: 1px solid #94a3b8; padding-top: 8px; font-size: 12px; color: #475569; }
  .rozet { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 12px; font-weight: bold; }
</style>
</head>
<body>
  <div class="kart">
    <div class="baslik"><img src="images/logo.png" alt="logo" width="32"><h2>Ekran ölçeği 2</h2></div>
    <p>Yerleşim CSS pikselinde yapılır, boyama cihaz pikselinde: metin ve
    kenarlar büyütülmüş değil, keskin çizilir. <span class="rozet">Keskin</span></p>
    <p class="ince">Bir pikselin kenarlığı iki cihaz pikseli kalınlığında.</p>
  </div>
</body>
</html>
