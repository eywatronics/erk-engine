<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Gradyanlar</title>
<style>
  body { margin: 20px; background: #ffffff; color: #1f2933; font-family: "Noto Sans"; font-size: 14px; }
  .satir { display: flex; gap: 16px; margin-bottom: 16px; }
  .kutu { width: 120px; height: 80px; }
  /* Linear: direction keywords, corners, angles. */
  .asagi { background: linear-gradient(#2563eb, #f97316); }
  .saga { background: linear-gradient(to right, #10b981, #1e3a8a); }
  .kose { background: linear-gradient(to top right, #fde047, #be123c); }
  .aci { background: linear-gradient(30deg, #7c3aed, #22d3ee); }
  .kose-ters { background: linear-gradient(to bottom left, #f472b6, #0f172a); }
  /* Stops: several, positioned, hard, hinted, transparent. */
  .cok { background: linear-gradient(90deg, #ef4444, #f59e0b, #84cc16, #06b6d4, #8b5cf6); }
  .konumlu { background: linear-gradient(90deg, #0ea5e9 20%, #f43f5e 40px, #facc15 90%); }
  .sert { background: linear-gradient(90deg, #16a34a 50%, #dc2626 50%); }
  .ipucu { background: linear-gradient(90deg, #1d4ed8, 20%, #fbbf24); }
  .saydam { background: #a3e635 linear-gradient(to bottom, rgba(30, 64, 175, 0.9), transparent); }
  /* Repeating. */
  .seritler { background: repeating-linear-gradient(45deg, #334155 0 10px, #e2e8f0 10px 20px); }
  .halkalar { background: repeating-radial-gradient(circle, #fb923c 0 8px, #fff7ed 8px 16px); }
  /* Radial: default, keywords, positions, sizes. */
  .radyal { background: radial-gradient(#fef08a, #9a3412); }
  .daire { background: radial-gradient(circle closest-side, #38bdf8, #1e1b4b); }
  .konum { background: radial-gradient(ellipse farthest-corner at 25% 30%, #ffffff, #059669 60%, #064e3b); }
  .boyut { background: radial-gradient(50px 25px at 60px 40px, #e11d48, #fecdd3 80%, #ffffff); }
  .yakin-kose { background: radial-gradient(circle closest-corner at 30px 20px, #4338ca, #c7d2fe); }
  /* Placement: tiles, layers, rounded corners, borders. */
  .doseme { background: linear-gradient(135deg, #0f766e 50%, #99f6e4 50%) 0 0 / 20px 20px; }
  .katman { background: radial-gradient(circle at 70% 40%, rgba(255, 255, 255, 0.85), transparent 40px),
                        linear-gradient(to right, #6d28d9, #db2777); }
  .yuvarlak { border-radius: 24px; background: linear-gradient(160deg, #f59e0b, #b91c1c); }
  .kenar { border: 8px solid #1e293b; background: linear-gradient(to right, #f8fafc, #64748b); }
  .tekrarsiz { background: linear-gradient(#22c55e, #14532d) no-repeat 20px 10px / 60px 40px; background-color: #f1f5f9; }
</style>
</head>
<body>
  <div class="satir"><div class="kutu asagi"></div><div class="kutu saga"></div><div class="kutu kose"></div><div class="kutu aci"></div><div class="kutu kose-ters"></div></div>
  <div class="satir"><div class="kutu cok"></div><div class="kutu konumlu"></div><div class="kutu sert"></div><div class="kutu ipucu"></div><div class="kutu saydam"></div></div>
  <div class="satir"><div class="kutu radyal"></div><div class="kutu daire"></div><div class="kutu konum"></div><div class="kutu boyut"></div><div class="kutu yakin-kose"></div></div>
  <div class="satir"><div class="kutu seritler"></div><div class="kutu halkalar"></div><div class="kutu doseme"></div><div class="kutu katman"></div><div class="kutu yuvarlak"></div></div>
  <div class="satir"><div class="kutu kenar"></div><div class="kutu tekrarsiz"></div></div>
</body>
</html>
