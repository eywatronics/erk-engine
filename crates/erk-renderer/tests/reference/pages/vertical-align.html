<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Dikey hizalama</title>
<style>
  body { margin: 24px; background: #ffffff; color: #1f2933; font-family: "Noto Sans"; font-size: 16px; }
  p { width: 520px; }
  .yukari { vertical-align: 6px; background: #fde68a; }
  .asagi { vertical-align: -4px; background: #bfdbfe; }
  .kutu { display: inline-block; width: 28px; height: 28px; }
  .orta { vertical-align: middle; background: #10b981; }
  .ust { vertical-align: top; background: #f97316; }
  .alt { vertical-align: bottom; background: #8b5cf6; }
  .metin-ust { vertical-align: text-top; background: #ef4444; }
  .metin-alt { vertical-align: text-bottom; background: #0ea5e9; }
  .yuksek { line-height: 48px; }
</style>
</head>
<body>
  <p>Kimyada su H<sub>2</sub>O, alan formülü πr<sup>2</sup>; dipnotlar da
  böyle durur<sup>1</sup> ve satırı biraz yükseltir.</p>
  <p>Kaydırılmış parçalar: <span class="yukari">yukarıda</span> ve
  <span class="asagi">aşağıda</span>, arka planlarıyla birlikte.</p>
  <p class="yuksek">Kutular: <span class="kutu orta"></span> orta,
  <span class="kutu ust"></span> üst, <span class="kutu alt"></span> alt.</p>
  <p>Metne göre: <span class="kutu metin-ust"></span> metin üstü,
  <span class="kutu metin-alt"></span> metin altı.</p>
</body>
</html>
