<!DOCTYPE html>
<!-- Box layout only, no text: Erk and Chrome should agree almost exactly. -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 20px; background: #eef2f5; }
  div { height: 40px; }
  .a { background: #2b6cb0; width: 300px; }
  .b { background: #c05621; margin-top: 30px; margin-bottom: 10px; }
  .c { background: #2f855a; margin-top: 25px; width: 50%; }
  .d { background: #6b46c1; width: calc(100% - 120px); margin-left: 60px; }
  .kap { background: #ffffff; padding: 15px; height: auto; margin-top: 20px; }
  .kap div { background: #b7791f; width: 200px; margin-left: 10px; }
</style>
</head>
<body>
  <div class="a"></div>
  <div class="b"></div>
  <div class="c"></div>
  <div class="d"></div>
  <div class="kap"><div></div></div>
</body>
</html>
