<!DOCTYPE html>
<!-- Paragraph shaping and wrapping, one style per paragraph. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  body { font-family: "Noto Sans"; color: #111111; background: #ffffff; }
  .dar { width: 260px; }
  h2 { color: #1a365d; }
</style>
</head>
<body>
  <h2>Paragraflar</h2>
  <p>Bir tarayıcı motoru önce çizer, sonra izole eder, en son betik çalıştırır.</p>
  <div class="dar">
    <p>Dar bir kapsayıcıda aynı cümle satırlara bölünür: önce çizer, sonra izole
    eder, en son betik çalıştırır.</p>
  </div>
  <p>İĞÜŞÖÇ ığüşöç — İstanbul'da ılık bir öğleden sonra.</p>
</body>
</html>
