<!DOCTYPE html>
<!-- A translucent root background paints the canvas over white (CSS 2
     §14.2): the frame stays opaque, the colour blends. -->
<html style="background: rgba(49, 130, 206, 0.35)">
<head>
<meta charset="utf-8">
<style>
  body { font-family: "Noto Sans"; margin: 24px; }
  .kutu { background: rgba(255, 255, 255, 0.6); padding: 12px; }
</style>
</head>
<body>
  <div class="kutu"><p>Yarı saydam tuval beyazın üstüne harmanlanır.</p></div>
</body>
</html>
