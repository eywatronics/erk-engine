<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kenarlıklar</title>
<style>
  body { margin: 24px; background: #ffffff; color: #1f2933; font-family: "Noto Sans"; font-size: 16px; }
  .satir { display: flex; gap: 24px; margin-bottom: 28px; align-items: flex-start; }
  .kutu { width: 90px; height: 60px; }
  .duz { border: 4px solid #1d4ed8; }
  .renkli { border: 8px solid #10b981; border-top-color: #f97316; border-left-color: #a855f7; }
  .kalin { border-width: 2px 10px 16px 6px; border-style: solid; border-color: #334155; }
  .yuvarlak { background: #fde68a; border-radius: 16px; }
  .daire { width: 70px; height: 70px; background: #3b82f6; border-radius: 50%; }
  .elips { background: #f472b6; border-radius: 45px / 20px; }
  .cerceve { border: 6px solid #0f766e; border-radius: 20px; background: #ccfbf1; }
  .golge { background: #ffffff; box-shadow: 0 4px 6px #1e293b; }
  .sert { background: #e0e7ff; box-shadow: 8px 8px 0 #4338ca; }
  .soluk { background: #dc2626; opacity: 0.4; }
  .grup { opacity: 0.6; background: #1d4ed8; padding: 10px; }
  .grup div { background: #f59e0b; height: 40px; }
  .vurgu { border: 2px solid #dc2626; padding: 0 4px; }
</style>
</head>
<body>
  <div class="satir"><div class="kutu duz"></div><div class="kutu renkli"></div><div class="kutu kalin"></div></div>
  <div class="satir"><div class="kutu yuvarlak"></div><div class="daire"></div><div class="kutu elips"></div><div class="kutu cerceve"></div></div>
  <div class="satir"><div class="kutu golge"></div><div class="kutu sert"></div><div class="kutu soluk"></div><div class="kutu grup"><div></div></div></div>
  <p style="width: 360px">Satır içinde <span class="vurgu">kenarlıklı bir parça</span> var; uzun bir
  <span class="vurgu">vurgu satır sonunda alt satıra kırılır</span> ve her parçası kendi kenarını alır.</p>
</body>
</html>
