# erk.h is generated from erk-ffi's source; a test compares it with the
# committed copy in include/erk.h.
language = "C"
include_guard = "ERK_H"
header = "/* erk.h: the Erk embedding ABI (p1-contract). Generated by cbindgen from\n * crates/erk-ffi; do not edit. A test fails when this copy is out of date. */"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
cpp_compat = true
documentation_style = "c"
style = "type"
usize_is_size_t = true

[export]
include = ["ErkConfig", "ErkEvent", "ErkBox", "ErkFrameTimings", "ErkInput", "ErkFrame"]

[enum]
rename_variants = "ScreamingSnakeCase"
