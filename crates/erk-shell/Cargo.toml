[package]
name = "erk-shell"
description = "Erk Engine shell: the demo host, the first user of the erk crate."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "erk"
path = "src/main.rs"

[dependencies]
# The only project crate the shell may depend on (checked in CI): it is the
# first host of the Rust API, and reaches the engine through nothing else.
erk = { path = "../erk" }

[dev-dependencies]
png = "0.18"

[lints]
workspace = true
