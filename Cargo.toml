[workspace]
resolver = "3"
members = [
    "crates/erk",          # the Rust API: an app, its document on the UI thread, its raster
    "crates/erk-shell",    # window, event loop, messaging with the renderer
    "crates/erk-renderer", # layout, display list, paint; the renderer thread
    "crates/erk-dom",      # arena DOM and HTML parsing
    "crates/erk-style",    # Stylo adapter (the one crate that may declare unsafe fns)
    "crates/erk-wpt",      # Web Platform Tests reftest runner (a tool, not part of the engine)
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["ismet kabatepe", "Erk Engine Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eywatronics/erk-engine"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
