name: ERK CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary development platform; Linux is the second
        # target. macOS joins in M2, when the window layer needs checking there.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A test that waits on a channel forever must fail the run, not hold it
    # for GitHub's six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # With no argument, rustup installs the toolchain named in
      # rust-toolchain.toml, so CI and local builds use the same compiler.
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      # Stylo's build script runs Python 3: python.exe on Windows, python3
      # elsewhere. The hosted images have it; the version goes in the log.
      - name: Python version (Windows)
        if: runner.os == 'Windows'
        run: python --version
      - name: Python version
        if: runner.os != 'Windows'
        run: python3 --version

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # --locked: build exactly what Cargo.lock records. Golden images and
      # reference scores depend on it, and a manifest that no longer matches
      # the lock fails here instead of being resolved anew.
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Run tests
        run: cargo test --workspace --locked --verbose

  # Architecture guards. Each one arrives in the same pull request as the thing
  # it protects; see docs/design/p0-verification.md for the schedule and the
  # deliberate violation each was tested with.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The expectations and commit message checks compare with the base.
          fetch-depth: 0

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Commit messages and the pull request name no AI tool
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/check-commit-messages.sh "$BASE"

      # The Chrome reference test fails if a score moves in either direction;
      # what it cannot see is an expectation lowered next to a regression.
      # A lowered score must say why on its own line.
      - name: Reference expectations only go down with a written reason
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/check-reference-expectations.sh "$BASE"

      # erk-wpt fails if a WPT result moves in either direction; this keeps
      # a regression from being written into the baseline without a reason.
      - name: WPT results only go down with a written reason
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/check-wpt-expectations.sh "$BASE"

      # unsafe_code = "forbid" lives in [workspace.lints]; a crate that drops
      # `[lints] workspace = true` silently opts out of it. The named
      # exceptions must still deny unsafe code, and forbid unsafe operations
      # inside the unsafe fns they are allowed.
      - name: Every crate inherits the workspace lints
        run: |
          exceptions="erk-style"
          fail=0
          for f in crates/*/Cargo.toml; do
            crate=$(basename "$(dirname "$f")")
            if [[ " $exceptions " == *" $crate "* ]]; then
              if ! grep -Pzq '\[lints\.rust\]\s*\nunsafe_code = "deny"\s*\nunsafe_op_in_unsafe_fn = "forbid"' "$f"; then
                echo "$f is a lint exception but does not deny unsafe_code and forbid unsafe_op_in_unsafe_fn"
                fail=1
              fi
            elif ! grep -Pzq '\[lints\]\s*\nworkspace = true' "$f"; then
              echo "$f does not inherit [workspace.lints]"
              fail=1
            fi
          done
          exit $fail

      - name: erk-style's unsafe code is exactly the five TElement signatures
        run: bash .github/scripts/check-style-unsafe-surface.sh

      # The cargo tree checks resolve every target and every feature, so a
      # dependency declared only for Windows or behind an optional feature
      # is seen from this Linux runner too. The tree is read into a variable
      # first: in `if cargo tree | grep`, a failing cargo tree would look
      # like "no match" and pass.

      # html5ever and Stylo must agree on the atom crates; two versions would
      # give element names that never compare equal.
      - name: html5ever and Stylo share one atom crate version
        run: |
          tree=$(cargo tree -d -e normal --target all --all-features --locked)
          if grep -E '^(web_atoms|string_cache) ' <<< "$tree"; then
            echo "duplicate atom crates: upgrade html5ever and stylo together"
            exit 1
          fi

      # The DOM is the bottom layer: everything above may depend on it, it
      # depends on no other workspace crate.
      - name: erk-dom depends on no other workspace crate
        run: |
          tree=$(cargo tree -p erk-dom -e normal --target all --all-features --locked --prefix none)
          if grep -E '^erk-' <<< "$tree" | grep -v '^erk-dom '; then
            echo "erk-dom must stay a leaf crate"
            exit 1
          fi

      # The shell talks to the renderer through messages and must not be able
      # to reach the DOM. --depth 1 on purpose: erk-shell -> erk-renderer ->
      # erk-dom is always there indirectly; a direct dependency is the breach.
      - name: erk-shell does not depend on erk-dom
        run: |
          tree=$(cargo tree -p erk-shell -e normal --target all --all-features --locked --depth 1 --prefix none)
          if grep -E '^erk-(dom|style) ' <<< "$tree"; then
            echo "the shell talks to the renderer through messages, not the DOM or styles"
            exit 1
          fi

      # The dependency check above cannot see a DOM type re-exported by the
      # renderer, shared state in a message, or the shell painting through
      # render_html instead of the renderer thread.
      - name: The renderer's surface is its thread and plain-data messages
        run: bash .github/scripts/check-renderer-surface.sh

      # The engine is embedded: all I/O, the environment and the clock
      # belong to the host application.
      - name: The engine core does no I/O and reads no environment or clock
        run: bash .github/scripts/check-core-io.sh

      # The renderer produces frames; windows and surfaces belong to the host
      # side (embedding contract, section 11).
      - name: erk-renderer does not depend on the window layer
        run: |
          tree=$(cargo tree -p erk-renderer -e normal --target all --all-features --locked --prefix none)
          if grep -E '^(winit|softbuffer) ' <<< "$tree"; then
            echo "erk-renderer must not know the window layer"
            exit 1
          fi

      # A feature is claimed only with a test behind it.
      - name: Every supported CSS feature names an existing test
        run: bash .github/scripts/check-css-support.sh

      # clippy's disallowed_types can be silenced with an attribute or
      # switched off in configuration, which would quietly bring
      # reference-counted nodes back.
      - name: The reference-counting ban in erk-dom holds
        run: bash .github/scripts/check-dom-rc-ban.sh

  # The release binary's size against the budget set from the M1.0
  # measurement. Linux only: sizes differ per platform, and one budget that
  # moves with every change is the point.
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Release build
        run: cargo build --release -p erk-shell --locked

      - name: The erk binary stays within its size budget
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/check-size-budget.sh target/release/erk "$BASE"

  # Every dependency's licence against the reviewed allow list in deny.toml.
  # Erk ships inside closed applications: nothing copyleft beyond the
  # file-level MPL-2.0, and no way past the list but changing it.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: deny.toml has no way past the allow list
        run: bash .github/scripts/check-license-config.sh deny.toml

      - name: Every licence is on the allow list
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          arguments: --all-features --locked

      - name: The fuzz targets' licences too
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fuzz/Cargo.toml
          command: check licenses
          arguments: --locked

  # cargo-fuzz on render_html: libFuzzer feeds it bytes for five minutes,
  # starting from the robustness corpus and the reference pages. A panic or
  # a crash fails the job and its input is kept as an artifact, to go into
  # crates/erk-renderer/tests/robustness/ with the fix. The nightly is
  # pinned so that a new nightly cannot turn the job red on its own.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # MEASUREMENT, not to be merged: inputs a second under three settings.
    strategy:
      fail-fast: false
      matrix:
        setting:
          - { name: asan-64k, sanitizer: address, max_len: 65536 }
          - { name: asan-4k, sanitizer: address, max_len: 4096 }
          - { name: none-4k, sanitizer: none, max_len: 4096 }
    name: fuzz (${{ matrix.setting.name }})
    env:
      NIGHTLY: nightly-2026-09-25
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: ${{ matrix.setting.sanitizer }}

      - name: The fuzz lock file is current
        run: cargo "+$NIGHTLY" fetch --locked --manifest-path fuzz/Cargo.toml

      - name: Two minutes of fuzzing, with final statistics
        run: |
          mkdir -p fuzz/corpus/render_html
          cargo "+$NIGHTLY" fuzz run -s ${{ matrix.setting.sanitizer }} render_html             fuzz/corpus/render_html             crates/erk-renderer/tests/robustness             crates/erk-renderer/tests/reference/pages             -- -max_total_time=120 -max_len=${{ matrix.setting.max_len }} -timeout=60 -rss_limit_mb=4096 -print_final_stats=1

  # The Web Platform Tests reftests of tests/wpt/dirs.txt, at the commit in
  # tests/wpt/WPT_COMMIT, against the baseline in tests/wpt/expectations.txt.
  # Any change fails: a regression must be fixed, an improvement recorded.
  wpt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned WPT commit and directories
        id: pin
        run: |
          echo "commit=$(tr -d '[:space:]' < tests/wpt/WPT_COMMIT)" >> "$GITHUB_OUTPUT"
          {
            echo 'dirs<<END_OF_DIRS'
            sed -e '/^#/d' -e '/^[[:space:]]*$/d' -e 's/^support:[[:space:]]*//' tests/wpt/dirs.txt
            echo 'END_OF_DIRS'
          } >> "$GITHUB_OUTPUT"

      # Outside target/: when the Cargo.lock changes, rust-cache restores a
      # fallback cache and first cleans target/, emptying a checkout there.
      - name: Check out the pinned WPT directories
        uses: actions/checkout@v4
        with:
          repository: web-platform-tests/wpt
          ref: ${{ steps.pin.outputs.commit }}
          path: wpt-checkout
          sparse-checkout: ${{ steps.pin.outputs.dirs }}
          persist-credentials: false

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: WPT reftests match the baseline
        run: cargo run --release --locked -p erk-wpt -- check --wpt wpt-checkout
